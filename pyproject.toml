[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pisama-verifier-gym"
version = "0.1.2"
description = "Verifier audit harnesses, datasheets, and agreement metrics from Pisama"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = [
    "ai",
    "agents",
    "evals",
    "verifiers",
    "datasheets",
    "agreement",
    "llm-judges",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.8.0",
    "pylint>=3.3.0",
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "xenon>=0.9.3",
]

[project.scripts]
pisama-verifier-gym = "pisama_verifier_gym.cli:main"

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://github.com/Pisama-AI/pisama-verifier-gym#readme"
Repository = "https://github.com/Pisama-AI/pisama-verifier-gym"
Issues = "https://github.com/Pisama-AI/pisama-verifier-gym/issues"
Changelog = "https://github.com/Pisama-AI/pisama-verifier-gym/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_verifier_gym"]

[tool.hatch.build.targets.sdist]
include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "examples",
    "src",
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
